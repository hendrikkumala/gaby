<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#0d2a40"/>
      <stop offset=".6" stop-color="#050d18"/>
      <stop offset="1" stop-color="#02050b"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#d9f6ff"/>
      <stop offset=".45" stop-color="#5fd4ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5fd4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset=".5" stop-color="#ffc864"/>
      <stop offset="1" stop-color="#ff9f3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="#5fd4ff" stroke-opacity=".35" stroke-width="2.5">
    <ellipse cx="256" cy="256" rx="205" ry="120" transform="rotate(-20 256 256)"/>
    <ellipse cx="256" cy="256" rx="200" ry="150" transform="rotate(35 256 256)"/>
    <ellipse cx="256" cy="256" rx="210" ry="90" transform="rotate(80 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="#06162a"/>
  <circle cx="256" cy="256" r="130" fill="url(#core)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="18" filter="url(#glow)"/>
</svg>
